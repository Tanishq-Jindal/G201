project:
  group_id: "G201"
  problem_id: "MP014"
  name: "ATM Cash Demand Prediction"

data:
  train_path: "data/raw/train.csv"
  later_path: "data/raw/later.csv"
  holdout_path: "data/raw/holdout_features.csv"

  target: "withdrawal_thousand_rs"
  id_column: "record_id"
  date_column: "date"
  group_column: "area"

  drop_columns:
    - record_id
    - date
    - cash_reloaded_next_day

  numerical_features:
    - nearby_shops
    - days_to_salary
    - footfall_index
    - distance_to_market_km
    - avg_ticket_rs
    - other_atms_1km

  categorical_features:
    - atm_type
    - area

preprocessing:
  sentinel_column: "avg_ticket_rs"
  sentinel_value: -1
  numerical_imputation: "median"
  categorical_imputation: "most_frequent"

training:
  random_state: 42
  test_size: 0.2
  metric: "mae"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "G201_MP014_ATM_Cash_Demand"
  registered_model_name: "MP014_ATM_Cash_Demand"
  champion_alias: "champion"

artifacts:
  model_path: "models/model.joblib"
  findings_path: "reports/findings.yaml"

monitoring:
  psi_bins: 10
  retrain_fraction: 0.7
  minimum_improvement: 0.05

models:
  linear_regression:
    fit_intercept: true

  random_forest:
    n_estimators: 100
    max_depth: 10

  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3